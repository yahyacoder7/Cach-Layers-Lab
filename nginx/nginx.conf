# ═══════════════════════════════════════════════════════════════════════════
# nginx.conf — EDGE CACHE LAYER for the Cach-Layers-Lab
#
# nginx sits in front of the NestJS app (port 3000 on the host machine) and
# caches HTTP responses. Diagrams:
#
#   Browser ──► :80  nginx (EDGE) ──► :3000 NestJS (DOWNSTREAM: Redis) ──► Postgres
#
# Every line below is explained, one comment per line.
# ═══════════════════════════════════════════════════════════════════════════

# ---- MAIN CONTEXT : configures the nginx PROCESS itself -------------------

# Defines WHICH operating-system user the nginx processes run as.
# nginx starts bound to ports < 1024 as root (in Docker that's the container root),
# then drops privileges to this unprivileged user. "nginx" is the user the
# official nginx Docker image creates for us, so we use it.
user  nginx;

# How many "worker" processes nginx should run (one process per CPU core = most throughput).
# "auto" lets nginx pick the number equal to your CPU cores automatically.
# You would set a fixed number (e.g. 4) only for advanced tuning.
worker_processes  auto;

# Where error messages are written, and the MINIMUM severity shown.
# "warn" = log messages that are warn(ing), error, crit, alert, emerg.
# Levels lowest→highest: debug, info, notice, warn, error, crit, alert, emerg.
# /var/log/nginx/error.log is inside the container (not on your machine).
error_log  /var/log/nginx/error.log  warn;

# Tells nginx where to store its "process id" file, so tools (like `nginx -s reload`)
# can signal the running master process. /var/run/nginx.pid is the standard location.
pid        /var/run/nginx.pid;

# ---- EVENTS CONTEXT : handles how nginx manages its connections -----------

# Opens the events context. Everything between these braces tunes the
# connection-handling behaviour of nginx (NOT the web routes).
events {

    # The MAXIMUM number of simultaneous connections each worker process can accept.
    # 1024 is the nginx default and is more than enough for this lab.
    # Total capacity ≈ worker_processes × worker_connections (auto cores × 1024).
    worker_connections  1024;
}

# ---- HTTP CONTEXT : everything about web traffic --------------------------

# Opens the http context. This is where ALL website/proxy logic lives.
http {

    # ── proxy_cache_path : reserve a disk area + an in-memory index for cached responses ──
    #
    # This is the ONLY line that "declares" a cache. It must be inside `http`
    # but OUTSIDE any server/location block.
    #
    #   /var/cache/nginx      = directory path where the cached FILES will be stored
    #   levels=1:2            = cache files are split folders deep "1:2" (dir/dir/file).
    #                           spreading files across folders avoids huge directories.
    #   keys_zone=edge_cache:10m = create an in-memory index named "edge_cache"
    #                           limited to 10 megabytes (this name is reused in
    #                           `proxy_cache edge_cache;` further down).
    #   max_size=100m         = hard limit of the cache's total size ON DISK (100 MB).
    #                           when reached, nginx removes least-recently-used entries.
    #   inactive=60m          = any cached entry not read for 60 minutes is deleted
    #                           even if it has not reached max_size yet.
    proxy_cache_path  /var/cache/nginx  levels=1:2  keys_zone=edge_cache:10m  max_size=100m  inactive=60m;

    # ── upstream : a NAME we give to the group of backend servers nginx will proxy to ──
    #
    # "app" is just a label WE invented; `proxy_pass http://app;` will reference it.
    # Inside an upstream block you list one or more real servers.
    upstream  app {

        # The address of our NestJS application.
        # host.docker.internal = a special hostname that Docker adds automatically,
        #                        resolving to the MACHINE that runs the containers.
        # So the nginx CONTAINER can reach the app running on your HOST at port 3000.
        server  host.docker.internal:3000;
    }

    # ── server : a "virtual host" — one website listening on one port ──
    #
    # Inside the http context you can have MANY server blocks. This one is
    # "whatever hits port 80" = our whole API.
    server {

        # Listen for connections on port 80 (TCP). This matches the compose file's
        # "80:80" port mapping = the port exposed to your browser.
        listen  80;

        # ── location / : matches EVERY incoming URL path ──
        # ( /products/1, /products, /anything... ) Everything routes through here.
        location / {

            # ── THE CACHE IS TURNED ON for this location ──
            # Tells nginx to look for / store responses in the cache index named
            # "edge_cache" (the exact name declared in proxy_cache_path above).
            proxy_cache         edge_cache;

            # Defines what makes a request "the same" and therefore reuses a cache entry.
            #   $scheme          = http ./ https
            #   $request_method  = GET / POST / PUT / PATCH / DELETE
            #   $uri             = the path without query string (e.g. /products/1)
            # Combined: only two IDENTICAL GET requests to the SAME path share a copy.
            # Because the method is in the key, POST/PATCH/DELETE can never reuse a GET cache.
            proxy_cache_key     $scheme$request_method$uri;

            # Only cache responses whose status code is 200 (OK), and keep them 60 seconds.
            # After 60s the entry is expired; the NEXT request goes to the app and re-caches.
            # This 60s window is exactly the "staleness" you observe in the lab.
            proxy_cache_valid   200  60s;

            # Append a response header named X-Cache-Status with the cache verdict.
            #   $upstream_cache_status = "HIT"   (nginx answered from cache)
            #                         = "MISS"  (app answered; entry just stored/expired)
            #                         = "BYPASS"(method/status is not cacheable)
            # This header is how WE SEE which layer answered. Example:
            #   X-Cache-Status: HIT  → nginx answered, app never ran!
            add_header          X-Cache-Status  $upstream_cache_status;

            # ── forwarding the request to the real app ──
            # Sends the request to the upstream group we named "app" above.
            proxy_pass          http://app;

            # Re-set the "Host" header to the ORIGINAL one the client sent.
            # Without this line the app would see nginx's host (localhost),
            # which can break routing / return 400 responses.
            proxy_set_header    Host        $host;

            # Pass the real client's IP address to the app in the X-Real-IP header.
            # Otherwise the app would see nginx's address (127.0.0.1) for every request.
            proxy_set_header    X-Real-IP   $remote_addr;
        }
    }
}